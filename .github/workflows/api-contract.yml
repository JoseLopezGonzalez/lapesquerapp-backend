name: API Contract

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  tests:
    name: Tests + Pint
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, zip, gd
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare .env
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: ''

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 20); do
            mysqladmin ping -h127.0.0.1 -P3306 -uroot --silent && break
            sleep 2
          done

      - name: Run Pint (style check)
        run: vendor/bin/pint --test

      - name: Run test suite
        run: php artisan test
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306

  api-contract:
    name: OpenAPI contract (generate + check)
    runs-on: ubuntu-latest
    needs: tests

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: contract
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, zip, gd
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare .env
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: contract
          DB_USERNAME: root
          DB_PASSWORD: ''

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 20); do
            mysqladmin ping -h127.0.0.1 -P3306 -uroot --silent && break
            sleep 2
          done

      - name: Central migrations
        run: php artisan migrate --force
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: contract

      - name: Seed demo tenant + admin fixture (for authenticated ResponseCalls)
        id: fixture
        run: echo "token=$(php artisan contract:seed-fixture --print-token-only)" >> "$GITHUB_OUTPUT"
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: contract

      - name: Check OpenAPI contract is up to date and free of breaking changes
        run: php artisan contract:check --fail-on-any
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: contract
          SCRIBE_AUTH_TOKEN: ${{ steps.fixture.outputs.token }}

      - name: Upload generated contract (debug artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-frontend-contract
          path: storage/app/scribe-public/openapi.yaml
          if-no-files-found: ignore
