<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Almacén genérico">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#sky)"/>
  <rect x="0" y="360" width="800" height="90" fill="#cbd5e1"/>

  <!-- Nave principal -->
  <rect x="150" y="190" width="500" height="170" fill="#94a3b8"/>
  <polygon points="150,190 400,110 650,190" fill="#64748b"/>

  <!-- Puerta de carga -->
  <rect x="360" y="260" width="90" height="100" fill="#334155"/>
  <rect x="368" y="268" width="74" height="8" fill="#94a3b8"/>
  <rect x="368" y="284" width="74" height="8" fill="#94a3b8"/>
  <rect x="368" y="300" width="74" height="8" fill="#94a3b8"/>
  <rect x="368" y="316" width="74" height="8" fill="#94a3b8"/>
  <rect x="368" y="332" width="74" height="8" fill="#94a3b8"/>

  <!-- Ventanas laterales -->
  <rect x="190" y="230" width="50" height="50" fill="#bfdbfe" stroke="#64748b" stroke-width="4"/>
  <rect x="560" y="230" width="50" height="50" fill="#bfdbfe" stroke="#64748b" stroke-width="4"/>

  <!-- Contenedores / palets -->
  <rect x="80" y="320" width="60" height="40" fill="#b45309"/>
  <rect x="80" y="320" width="60" height="10" fill="#92400e"/>
  <rect x="660" y="310" width="70" height="50" fill="#0e7490"/>
  <rect x="660" y="310" width="70" height="10" fill="#155e75"/>

  <text x="400" y="410" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#475569" text-anchor="middle">
    Sin imagen disponible
  </text>
</svg>
